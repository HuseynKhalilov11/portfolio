    <main>
        <section id="game">
            <h2>🎮 Rock Paper Scissors</h2>
            <p>Choose a move and play against the computer.</p>
            
            <div class="game-buttons">
                <button data-choice="Rock">✊ Rock</button>
                <button data-choice="Paper">📄 Paper</button>
                <button data-choice="Scissors">✂️ Scissors</button>
            </div>
            
            <div class="game-result">
                <p><strong>Your choice:</strong> <span id="player-choice">-</span></p>
                <p><strong>Computer choice:</strong> <span id="computer-choice">-</span></p>
                <p id="round-result">Pick a move to start.</p>
            </div>
            
            <div class="scoreboard">
                <div><strong>👤 Player:</strong> <span id="player-score">0</span></div>
                <div><strong>💻 Computer:</strong> <span id="computer-score">0</span></div>
            </div>
            
            <button id="reset-button" class="reset-button">🔄 Reset Score</button>
        </section>
    </main>

    <footer>
